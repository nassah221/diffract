name: Feature request
description: Suggest an idea or improvement for Diffract
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or workflow where Diffract falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working. Mockups and examples welcome.
    validations:
      required: true
