name: Dev build

# Build a downloadable Diffract Dev app with a separate bundle id, data directory,
# and diffract-dev:// link scheme. The rolling `dev` prerelease is replaced each run.

on:
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  desktop:
    name: macOS universal (dev)
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DIFFITY_CHANNEL: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal-dev

      - run: pnpm install --frozen-lockfile

      - name: Build the diffity-mcp and diffity-cli sidecars for both architectures
        run: node scripts/prepare-mcp.mjs --release
        env:
          TAURI_ENV_TARGET_TRIPLE: universal-apple-darwin

      - name: Stamp a dev version from the app version
        id: version
        run: |
          BASE=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          VER="${BASE}-dev.${{ github.run_number }}"
          python3 -c "import json,sys; p='src-tauri/tauri.conf.json'; d=json.load(open(p)); d['version']=sys.argv[1]; json.dump(d,open(p,'w'),indent=2)" "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Diffract Dev $VER"

      - name: Remove the previous dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev --cleanup-tag --yes || true

      # The Liquid Glass .icon catalog is compiled only where Xcode/actool exists.
      - name: Select Xcode
        run: |
          newest=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          if [ -d "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcode-select -p
          xcodebuild -version

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple credentials are optional; without them the DMG is unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: dev
          releaseCommitish: ${{ github.sha }}
          releaseName: Diffract Dev ${{ steps.version.outputs.version }}
          releaseBody: |
            Downloadable test build of `${{ github.ref_name }}` at ${{ steps.version.outputs.short }}. Not a stable release.

            Installs as **Diffract Dev** alongside Diffract, with its own bundle identifier and data directory.
          releaseDraft: false
          prerelease: true
          args: --target universal-apple-darwin --config src-tauri/tauri.dev.conf.json --verbose
