name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  desktop:
    name: macOS universal
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal

      - run: pnpm install --frozen-lockfile

      # Build sidecars first so a sidecar failure is its own red step.
      - name: Build the diffity-mcp and diffity-cli sidecars for both architectures
        run: node scripts/prepare-mcp.mjs --release
        env:
          TAURI_ENV_TARGET_TRIPLE: universal-apple-darwin

      - name: Resolve and validate the release version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="v$VERSION"
          case "$GITHUB_REF" in
            refs/tags/*)
              if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
                echo "Tag $GITHUB_REF_NAME must match tauri.conf.json version ($TAG)." >&2
                exit 1
              fi
              TAG=$GITHUB_REF_NAME
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Diffract $VERSION as $TAG"

      # The Liquid Glass .icon catalog is compiled only where Xcode/actool exists.
      - name: Select Xcode
        run: |
          newest=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          if [ -d "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcode-select -p
          xcodebuild -version

      # tauri cannot compile an Icon Composer document itself: its in-process actool call crashes on them
      # (tauri-apps/tauri#15315), which fails the whole bundle where Xcode exists. Use the repo's script,
      # and tolerate it failing — the step below then just leaves the raster .icns to carry the icon.
      - name: Compile the Liquid Glass icon catalog
        continue-on-error: true
        run: node scripts/generate-icons.mjs

      - name: Ship the compiled catalog, not the Icon Composer source
        run: |
          python3 - <<'PY'
          import json, os
          path = 'src-tauri/tauri.conf.json'
          source, compiled = 'icons/diffract.icon', 'icons/Assets.car'
          conf = json.load(open(path))
          icons = [i for i in conf['bundle']['icon'] if i != source]
          if os.path.exists(os.path.join('src-tauri', compiled)):
              icons.insert(0, compiled)
              print('shipping', compiled)
          else:
              print('no catalog compiled; shipping the raster .icns only')
          conf['bundle']['icon'] = icons
          json.dump(conf, open(path, 'w'), indent=2)
          print(icons)
          PY

      # An unset secret still arrives as an empty string, and tauri signs when these variables are merely
      # present: an empty APPLE_CERTIFICATE made it import a zero-byte .p12 and fail the bundle. Export
      # them only when there is a certificate to use, so a secret-less run ships an unsigned DMG.
      - name: Export Apple credentials, if any
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
              echo "APPLE_ID=$NOTARY_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Apple credentials present: the DMG will be signed and notarised."
          else
            echo "No Apple credentials: the DMG will be unsigned."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Diffract ${{ steps.version.outputs.version }}
          releaseBody: Universal macOS DMG for Diffract ${{ steps.version.outputs.version }} (Apple Silicon and Intel).
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --verbose
